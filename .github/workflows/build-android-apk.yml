name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || {
            echo "CLI sync returned non-zero, copying assets manually..."
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/
          }

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Index-Motors-Debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Index-Motors-Android-APK
          path: Index-Motors-Debug.apk
          retention-days: 30
